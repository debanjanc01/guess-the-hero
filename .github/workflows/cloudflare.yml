name: Check and deploy game to Cloudflare
on:
  push:
    branches: [master]
    paths: ['web/**', '.github/workflows/cloudflare.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/cloudflare.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-game-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run assets:verify
      - run: npm run build:cloudflare
      - name: Deploy production
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
      - name: Deployment setup reminder
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo '::warning::Production deployment skipped: CLOUDFLARE_API_TOKEN is not configured. See web/README.md.'
